product: jvm/app

apply:
  - common.module-template.yaml

repositories:
  - https://jitpack.io

dependencies:
  - com.sksamuel.scrimage:scrimage-core:4.3.0
  - io.heapy.kotaml:kotaml:0.113.0
  - dev.reimer:progressbar-ktx:0.1.0
  - me.tongfei:progressbar:0.10.2
  - com.github.ajalt.clikt:clikt:5.1.0

test-dependencies:
  - org.junit.jupiter:junit-jupiter-params:6.1.0

settings:
  jvm:
    # The entry point lives in KTracer.kt, not main.kt, so it is not auto-detected.
    mainClass: org.example.ktracer.KTracerKt
  kotlin:
    # Scene files are read with kotlinx.serialization (kotaml); the runtime version matches kotaml's.
    serialization:
      enabled: true
      version: 1.12.0
