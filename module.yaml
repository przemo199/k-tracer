product: jvm/app

# Keep the Gradle-style source layout: src/main/kotlin, src/test/kotlin, src/main/resources.
layout: maven-like

repositories:
  - https://jitpack.io

dependencies:
  - com.sksamuel.scrimage:scrimage-core:4.3.0
  - tools.jackson.dataformat:jackson-dataformat-yaml:3.1.3
  - dev.reimer:progressbar-ktx:0.1.0
  - me.tongfei:progressbar:0.10.2
  - com.github.ajalt.clikt:clikt:5.1.0

test-dependencies:
  - org.junit.jupiter:junit-jupiter-params:6.1.0

settings:
  kotlin:
    version: 2.5.0-Beta2
    freeCompilerArgs:
      - -Xfull-value-classes
      - -Xcompanion-blocks-and-extensions
  jvm:
    # The entry point lives in KTracer.kt, not main.kt, so it is not auto-detected.
    mainClass: org.example.ktracer.KTracerKt
    jdk:
      # Kotlin 2.5.0 (Beta2 and RC) supports JDK up to 26; Kotlin Toolchain enforces this, Gradle did not.
      version: 26
